name: history
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'space-separated symbols (6-digit KRX codes or US tickers)'
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas yfinance finance-datareader
      - run: python scripts/history.py ${{ inputs.symbols }}
      - name: commit
        run: |
          git config user.name "stock-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history
          git commit -m "history ${{ inputs.symbols }}" || echo "no changes"
          git pull --rebase -q && git push
