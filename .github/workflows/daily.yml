name: daily-prices
on:
  schedule:
    - cron: '40 21 * * *'   # 06:40 KST daily (after US close)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas yfinance finance-datareader pykrx
      - run: python scripts/fetch_and_screen.py
      - name: commit
        run: |
          git config user.name "stock-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "data $(date -u +%F)" || echo "no changes"
          git push
